<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Excel VBA Assistant UI Preview</title>
<style>
  :root {
    --bg: #f6f9fc;
    --surface: #ffffff;
    --surface-soft: #eef5ff;
    --border: #d9e5f2;
    --text: #172033;
    --muted: #5f6f85;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #dbeafe;
    --primary-ink: #ffffff;
    --secondary: #64748b;
    --secondary-hover: #475569;
    --ok: #16a34a;
    --warn-bg: #fff7ed;
    --warn: #c2410c;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 18px;
    background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.55;
  }

  .panel {
    width: min(100%, 340px);
    margin: 0 auto;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .header {
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .header-title {
    font-size: 22px;
    line-height: 1.15;
    font-weight: 800;
    color: var(--text);
  }

  .header-desc {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  .version-line,
  .notice-line {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
  }

  .notice-line {
    color: #334155;
    font-weight: 700;
  }

  .status-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 2px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  .badge.warn {
    background: var(--warn-bg);
    color: var(--warn);
  }

  .badge.ok {
    background: #dcfce7;
    color: var(--ok);
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
  }

  .section-title::before {
    content: "";
    width: 4px;
    height: 16px;
    border-radius: 999px;
    background: var(--primary);
  }

  label {
    display: block;
    margin: 14px 0 7px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .input-display {
    min-height: 42px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #e4edf7;
    background: #f8fafc;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 22px;
  }

  .placeholder {
    color: #94a3b8;
  }

  button {
    width: 100%;
    min-height: 42px;
    margin-top: 12px;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: var(--primary-ink);
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  button:hover {
    background: var(--primary-hover);
    box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.08), 0 8px 18px rgba(37, 99, 235, 0.22);
  }

  button.secondary {
    background: var(--secondary);
  }

  button.secondary:hover {
    background: var(--secondary-hover);
    box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.08), 0 8px 18px rgba(71, 85, 105, 0.18);
  }

  .button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .option:first-of-type {
    padding-top: 0;
  }

  .option:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }

  .option-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
  }

  .option-desc {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
  }

  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex: 0 0 44px;
  }

  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #dbe3ed;
    transition: background 0.18s ease;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
    transition: transform 0.18s ease;
  }

  .switch input:checked + .slider {
    background: var(--primary);
  }

  .switch input:checked + .slider::before {
    transform: translate(20px, -50%);
  }

  .hint {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <main class="panel">
    <div class="eyebrow">Excel VBA</div>

    <header class="header">
      <div class="header-title">VBA助手</div>
      <div class="version-line">版本号 v0.5.0</div>
      <div class="notice-line">仅限内部使用，请勿外传</div>
      <div class="status-row">
        <span>服务状态：</span>
        <span class="badge warn">未连接</span>
      </div>
    </header>

    <section class="section">
      <h2 class="section-title">路径</h2>

      <label>Excel 文件</label>
      <div class="input-display placeholder">未选择</div>
      <button>选择文件</button>

      <label>VBA 同步目录</label>
      <div class="input-display placeholder">未设置</div>
      <div class="button-row">
        <button class="secondary">选择目录</button>
        <button class="secondary">Excel相同目录</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">配置选项</h2>

      <div class="option">
        <div>
          <div class="option-title">自动同步</div>
          <div class="option-desc">开启后，VBA代码自动同步至Excel</div>
        </div>
        <label class="switch">
          <input type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="option">
        <div>
          <div class="option-title">自动执行 VBA</div>
          <div class="option-desc">开启后，AI可自动执行测试</div>
        </div>
        <label class="switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="option">
        <div>
          <div class="option-title">Excel 置顶</div>
          <div class="option-desc">保持Excel窗口始终在最前</div>
        </div>
        <label class="switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">手工同步</h2>
      <div class="button-row">
        <button>同步至目录</button>
        <button>写回Excel</button>
      </div>
      <p class="hint">如遇错误，请手工执行上述功能</p>
    </section>
  </main>
</body>
</html>
